services:
  mongo1:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo2:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo3:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >
        until mongosh --host mongo1:27017 --quiet --eval "db.adminCommand('ping').ok"; do sleep 2; done;
        mongosh --host mongo1:27017 --quiet --eval '
        try {
          rs.status();
          print("Replica set already initialized");
        } catch (e) {
          rs.initiate({_id:"rs0",members:[
            {_id:0,host:"mongo1:27017",priority:2},
            {_id:1,host:"mongo2:27017",priority:1},
            {_id:2,host:"mongo3:27017",arbiterOnly:true}
          ]});
        }';
        until mongosh --host mongo1:27017 --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 2; done;
        echo 'MongoDB replica set is ready.'

  api1:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8000
      INSTANCE_ID: api1
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017/videotube?replicaSet=rs0&retryWrites=true&w=majority
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-1d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-10d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    expose: ["8000"]

  api2:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8000
      INSTANCE_ID: api2
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017/videotube?replicaSet=rs0&retryWrites=true&w=majority
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-1d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-10d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo-init: { condition: service_completed_successfully }
    expose: ["8000"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api1, api2]

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
